include_ccfddl_catalog: true

years:
  - 2023
  - 2024
  - 2025
  - 2026

concurrency:
  threads: 5

limit_per_conference: 0
# 改为输出目录

output_dir: "data"

vector_index:
  backend: qdrant
  path: data/qdrant
  collection: papercollect_papers
  embedding_provider: fastembed
  dense_model: jinaai/jina-embeddings-v2-base-zh
  sparse_model: prithivida/Splade_PP_en_v1
  on_disk_vectors: true
  batch_size: 64
  prefetch_multiplier: 4
  timeout: 120

# Optional path prefix for reverse proxies, for example "/papercollect".
url_base: ""
