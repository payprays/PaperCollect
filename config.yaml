include_ccfddl_catalog: true

years:
  - 2022
  - 2023
  - 2024
  - 2025
  - 2026

concurrency:
  threads: 5

limit_per_conference: 0
# 改为输出目录
# Prefer setting OPENAI_API_KEY in the environment to avoid committing secrets
openai_api_key: ""
openai_model: "gpt-4o"
embedding_model: "text-embedding-3-small"

output_dir: "data"

# Optional path prefix for reverse proxies, for example "/papercollect".
url_base: ""
