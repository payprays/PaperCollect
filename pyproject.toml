[project]
name = "papercollect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "numpy>=2.4.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.14.0",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
]

[project.scripts]
papercollect-collect = "main:main"
papercollect-index = "index_papers:main"
papercollect-search = "search_papers:main"
papercollect-web = "web:main"
papercollect-backfill-limited = "backfill_limited_papers:main"
papercollect-backfill-metadata = "backfill_metadata:main"
pc-collect = "main:main"
pc-index = "index_papers:main"
pc-search = "search_papers:main"
pc-web = "web:main"
pc-backfill-limited = "backfill_limited_papers:main"
pc-backfill-metadata = "backfill_metadata:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["backfill_limited_papers", "backfill_metadata", "index_papers", "main", "search_papers", "web"]
packages = [
    "src",
    "src.clients",
    "src.core",
    "src.data",
    "src.services",
    "src.web",
    "src.web.static",
    "src.web.templates",
]
include-package-data = true

[tool.setuptools.package-data]
"src.data" = ["*.yaml"]
"src.web.static" = ["*.css", "*.js"]
"src.web.templates" = ["*.html"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
